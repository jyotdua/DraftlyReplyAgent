  <text x="490" y="267" fill="#915E42" font-family="'Trebuchet MS', Arial, sans-serif" font-size="18" font-weight="700">Gmail</text>
  <text x="490" y="293" fill="#2B1B16" font-family="'Trebuchet MS', Arial, sans-serif" font-size="16">Connected</text>
  <circle cx="500" cy="352" r="16" fill="#FF5C00"/>
  <circle cx="546" cy="352" r="16" fill="#FFD8BF"/>
  <circle cx="592" cy="352" r="16" fill="#2B1B16"/>
